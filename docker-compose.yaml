services:
  sddmaker:
    build: .
    image: sddmaker:local
    init: true
    ports:
      - "127.0.0.1:${SDDMAKER_PORT:-40000}:3000"
      # impeccable live 보조 서버 (화면에 주입된 live.js가 localhost:8400을 부른다)
      - "127.0.0.1:48400:8401"
    volumes:
      - data:/app/data
      - cli-home:/home/node
    stop_grace_period: 10s

volumes:
  data:
  cli-home:
